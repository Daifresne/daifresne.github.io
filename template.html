<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{author}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<link rel="alternate" type="application/rss+xml" title="{{site}}" href="{{root}}feed.xml">
<link rel="stylesheet" href="{{root}}style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="{{root}}index.html">{{site}}</a>
    <nav>
      <a href="{{root}}index.html">首页</a>
      <a href="{{root}}about.html">关于</a>
      <a href="{{root}}feed.xml">RSS</a>
    </nav>
  </div>
</header>

<main class="wrap">
{{content}}
</main>

<footer class="site-foot">
  <div class="wrap">
    <p>© {{year}} {{author}} · 用 markdown 手写，<a href="{{root}}feed.xml">RSS 订阅</a></p>
  </div>
</footer>

</body>
</html>
